<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#151a36">
<title>کلمه‌ساز</title>
<style>
:root{--bg:#10142b;--panel:#1c2346;--panel2:#252d58;--gold:#ffd166;--mint:#64e6b4;--text:#f6f7ff;--muted:#aeb7df;--pink:#ff7b9c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#28335f 0,#10142b 58%);color:var(--text);font-family:Tahoma,"Arial",sans-serif;min-height:100vh}
.wrap{max-width:520px;margin:auto;padding:18px 14px 30px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:26px;font-weight:900;letter-spacing:-1px}.brand span{color:var(--gold)}.coin{background:#342d4b;border:1px solid #75633b;color:var(--gold);border-radius:20px;padding:9px 13px;font-weight:bold;white-space:nowrap}.top-actions{display:flex;align-items:center;gap:7px}.shopbtn{border:1px solid #75633b;background:#40365f;color:#ffd166;border-radius:18px;padding:9px 10px;font-family:inherit;font-weight:bold;cursor:pointer}.shopgrid{display:grid;grid-template-columns:1fr;gap:8px}.pack{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#151d3b;border:1px solid #465583;border-radius:13px;padding:12px;text-align:right}.pack button{background:#64e6b4;border:0;border-radius:10px;padding:9px;font-family:inherit;font-weight:bold;color:#11203a;cursor:pointer}
.progress{margin:18px 0 12px;background:#30385e;height:7px;border-radius:20px;overflow:hidden}.bar{height:100%;width:1%;background:linear-gradient(90deg,#64e6b4,#ffd166);transition:width .25s}
.panel{background:linear-gradient(145deg,rgba(35,44,86,.96),rgba(24,30,62,.96));border:1px solid #394574;border-radius:24px;padding:18px;box-shadow:0 12px 35px #080b1c66}
.levelrow{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}.levelnum{color:var(--gold);font-weight:bold}
.clue{margin:17px 0 14px;text-align:center;color:#dce4ff;font-size:14px}.slots{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;min-height:56px;align-items:center;margin:12px 0 18px}
.slot{min-width:39px;height:47px;border-radius:12px;background:#111833;border:1px solid #45517f;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:bold;cursor:pointer}
.slot.filled{background:#30416b;border-color:#64e6b4}.slot.blank{border-bottom:3px solid var(--gold)}
.letters{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;min-height:58px;align-items:center;margin:16px 0 18px}
.letter{width:51px;height:55px;border:0;border-radius:15px;background:linear-gradient(145deg,#f8f9ff,#cbd5f6);color:#1c2346;font-size:24px;font-weight:900;box-shadow:0 4px 0 #929fc9;cursor:pointer}
.letter:active{transform:translateY(3px);box-shadow:0 1px 0 #929fc9}.letter.used{opacity:.24;pointer-events:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:14px;padding:13px 10px;font-family:inherit;font-weight:bold;font-size:14px;cursor:pointer}.primary{background:linear-gradient(90deg,#64e6b4,#8df0cb);color:#11203a}.secondary{background:#333d6b;color:white;border:1px solid #4d5b91}.hint{background:#40365f;color:#ffd166;border:1px solid #776345}.message{min-height:27px;text-align:center;margin:13px 0 0;color:var(--muted);font-size:14px}.message.good{color:var(--mint)}.message.bad{color:var(--pink)}
.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:12px}.bottom button{background:none;border:0;color:#aeb7df;text-decoration:underline;font:inherit}
.modal{position:fixed;inset:0;background:#070a1bd9;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.show{display:flex}.modalbox{max-width:390px;width:100%;background:#20284f;border:1px solid #4c5a91;border-radius:22px;padding:24px;text-align:center}.modalbox h2{color:var(--gold)}.modalbox p{line-height:1.9;color:#e5e9ff}.modalbox .btn{width:100%;margin-top:10px}
@media(max-width:360px){.letter{width:43px;height:49px}.slot{min-width:32px;height:41px}.brand{font-size:23px}}

.menu-screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at top,#35447d,#10142b 70%);overflow:auto}
.menu-card{width:min(100%,480px);background:#1c2346;border:1px solid #52629a;border-radius:28px;padding:25px 20px;box-shadow:0 20px 60px #0008;text-align:center}
.menu-logo{font-size:36px;font-weight:900;margin:5px 0 8px}.menu-logo span{color:var(--gold)}.menu-sub{color:var(--muted);line-height:1.8;margin-bottom:20px}
.menu-btn{display:block;width:100%;margin:10px 0;padding:15px;border:0;border-radius:15px;font:700 16px Tahoma,Arial;cursor:pointer}.menu-start{background:linear-gradient(90deg,#64e6b4,#9af4d3);color:#13213b}.menu-secondary{background:#303b6c;border:1px solid #4c5d94;color:#fff}
.lang-label{display:block;text-align:right;margin:15px 0 7px;color:#e5e9ff;font-size:14px}.lang-select{width:100%;padding:12px;border-radius:12px;background:#111833;color:#fff;border:1px solid #4b5a8d;font:15px Tahoma,Arial}
.stages-screen{position:fixed;inset:0;z-index:11;display:none;background:#10142b;padding:18px;overflow:auto}.stages-head{max-width:600px;margin:0 auto 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.stage-grid{max-width:600px;margin:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.stage-item{padding:12px 2px;border-radius:10px;border:1px solid #465583;background:#20284f;color:#fff;font-weight:bold;cursor:pointer}.stage-item.done{background:#215c51;border-color:#64e6b4}.stage-item.current{border:2px solid var(--gold)}.stage-item.locked{opacity:.4}.screen-title{color:var(--gold);font-size:23px;font-weight:900}
@media(min-width:500px){.stage-grid{grid-template-columns:repeat(8,minmax(0,1fr))}}
</style>
</head>
<body>
<section class="menu-screen" id="mainMenu"><div class="menu-card">
 <div class="menu-logo">کلمه<span>‌ساز</span></div>
 <div class="menu-sub" id="menuSubtitle">بازی کلمه‌یابی با ۱۰۰۰ مرحله و فروشگاه سکه</div>
 <label class="lang-label" for="languageSelect" id="languageLabel">زبان بازی</label>
 <select class="lang-select" id="languageSelect"></select>
 <button class="menu-btn menu-start" id="startGame">▶ شروع بازی</button>
 <button class="menu-btn menu-secondary" id="viewStages">▦ دیدن مراحل</button>
 </div></section>
<section class="stages-screen" id="stagesScreen"><div class="stages-head"><div class="screen-title" id="stagesTitle">مراحل بازی</div><button class="btn secondary" id="backMenu">بازگشت به منو</button></div><div class="stage-grid" id="stageGrid"></div></section>
<div class="wrap" id="gameWrap" style="display:none">
 <header class="top"><div class="brand">کلمه<span>‌ساز</span></div><div class="top-actions"><button class="shopbtn" id="shop">🛒 خرید سکه</button><div class="coin">🪙 <b id="coins">50</b></div></div></header>
 <div class="progress"><div class="bar" id="bar"></div></div>
 <main class="panel">
  <div class="levelrow"><span>مرحلهٔ <b class="levelnum" id="level">۱</b> از ۱۰۰۰</span><span>🧩 کلمه‌یابی</span></div>
  <div class="clue" id="clue">راهنمای کلمه اینجاست</div>
  <div class="slots" id="slots" aria-label="جای حروف پاسخ"></div>
  <div class="letters" id="letters" aria-label="حروف قابل انتخاب"></div>
  <div class="actions">
   <button class="btn primary" id="check">بررسی پاسخ ✓</button>
   <button class="btn secondary" id="clear">پاک کردن ↺</button>
   <button class="btn hint" id="hint">💡 راهنما (۱۰ سکه)</button>
   <button class="btn secondary" id="next" disabled>مرحلهٔ بعد ←</button>
  </div>
  <div class="message" id="message" role="status">حروف را به ترتیب انتخاب کن.</div>
 </main>
 <div class="bottom"><span>بازی آفلاین • ذخیرهٔ خودکار</span><button id="reset">شروع دوباره</button></div>
</div>
<div class="modal" id="modal"><div class="modalbox"><h2 id="modalTitle">آفرین!</h2><p id="modalText"></p><div id="shopPacks" class="shopgrid" hidden></div><button class="btn primary" id="modalBtn">ادامه</button><button class="btn secondary" id="closeShop" hidden>بستن فروشگاه</button></div></div>

let langCode='fa';
function tr(i){const row=LANGS.find(x=>x[0]===langCode)||LANGS[0];return row[i]||LANGS[0][i]}
function setupLanguages(){const sel=$('languageSelect');LANGS.forEach(row=>{const o=document.createElement('option');o.value=row[0];o.textContent=row[1];sel.appendChild(o)});sel.value=langCode;sel.onchange=()=>{langCode=sel.value;try{localStorage.setItem('kalamesaz-lang',langCode)}catch(e){};applyLanguage();}}
function applyLanguage(){const row=LANGS.find(x=>x[0]===langCode)||LANGS[0];document.documentElement.lang=langCode;document.documentElement.dir=['fa','ar','he','ur'].includes(langCode)?'rtl':'ltr';$('menuSubtitle').textContent=row[3];$('languageLabel').textContent=row[4];$('startGame').textContent='▶ '+row[5];$('viewStages').textContent='▦ '+row[6];$('stagesTitle').textContent=row[7];$('backMenu').textContent=row[8];$('check').textContent=row[12];$('clear').textContent=row[13];$('hint').textContent='💡 '+row[14];$('next').textContent=row[15];document.querySelector('.levelrow span:first-child').innerHTML=row[9]+' <b class="levelnum" id="level">'+faDigits(levelIndex+1)+'</b> '+row[10]+' 1000';document.querySelector('.levelrow span:last-child').textContent='🧩 '+row[11];$('brandDummy');render();}

// ۱۰۰۰ مرحله از ۱۰ دور با افزایش تدریجی دشواری؛ در هر دور، بانک واژه‌ها دوباره با ترتیب حروف متفاوت استفاده می‌شود.
const LEVELS = Array.from({length:1000}, (_,i)=>{const base=BASE_LEVELS[i%BASE_LEVELS.length];const letters=[...base.letters];let seed=i+37;for(let j=letters.length-1;j>0;j--){seed=(seed*9301+49297)%233280;const k=seed%(j+1);[letters[j],letters[k]]=[letters[k],letters[j]];}return {...base,level:i+1,letters,clue:(i<100?base.clue:`دور ${Math.floor(i/100)+1} — ${base.clue}`)};});

const faDigits=n=>String(n).replace(/[0-9]/g,d=>"۰۱۲۳۴۵۶۷۸۹"[+d]);
const $=id=>document.getElementById(id);
let levelIndex=0, coins=50, solved=[], selected=[], revealed=false;
try{const s=JSON.parse(localStorage.getItem("kalamesaz-save")||"null");if(s){levelIndex=Math.min(999,Math.max(0,s.levelIndex||0));coins=Math.max(0,s.coins??50);solved=Array.isArray(s.solved)?s.solved:[]}langCode=localStorage.getItem("kalamesaz-lang")||"fa"}catch(e){}
function save(){try{localStorage.setItem("kalamesaz-save",JSON.stringify({levelIndex,coins,solved}))}catch(e){}}
function level(){return LEVELS[levelIndex]}
function showMessage(t,type=""){ $("message").textContent=t;$("message").className="message "+type}
function render(){
 const l=level(); $("coins").textContent=faDigits(coins);$("level").textContent=faDigits(levelIndex+1);
 $("bar").style.width=((levelIndex+(solved.includes(levelIndex)?1:0))/1000*100)+"%";
 $("clue").textContent="راهنما: "+l.clue;
 $("slots").innerHTML="";$("letters").innerHTML="";
 selected=[];revealed=false;
 l.answer.split("").forEach((ch,i)=>{const el=document.createElement("button");el.className="slot blank";el.textContent="";el.setAttribute("aria-label","جایگاه "+faDigits(i+1));el.onclick=()=>removeAt(i);$("slots").appendChild(el)});
 l.letters.forEach((ch,i)=>{const el=document.createElement("button");el.className="letter";el.textContent=ch;el.dataset.index=i;el.onclick=()=>choose(i);$("letters").appendChild(el)});
 $("next").disabled=!solved.includes(levelIndex);
 if(solved.includes(levelIndex)){showMessage("این مرحله قبلاً حل شده است. می‌توانی دوباره تمرین کنی.","good");fillAnswer(l.answer)}
 else showMessage("حروف را به ترتیب انتخاب کن.");
 save();
}
function choose(i){if(solved.includes(levelIndex))return;const buttons=[...$("letters").children];if(buttons[i].classList.contains("used"))return;selected.push(i);buttons[i].classList.add("used");updateSlots();showMessage("ادامه بده…")}
function updateSlots(){const slots=[...$("slots").children];slots.forEach((el,i)=>{const idx=selected[i];el.textContent=idx===undefined?"":level().letters[idx];el.classList.toggle("filled",idx!==undefined);el.classList.toggle("blank",idx===undefined)})}
function removeAt(i){if(solved.includes(levelIndex))return;const idx=selected[i];if(idx===undefined)return;selected.splice(i,1);$("letters").children[idx].classList.remove("used");updateSlots()}
function clearSelection(){selected.forEach(i=>$("letters").children[i].classList.remove("used"));selected=[];updateSlots();showMessage("حروف پاک شدند.")}
function fillAnswer(answer){clearSelection();const used=new Set();for(const ch of answer){const idx=level().letters.findIndex((c,i)=>c===ch&&!used.has(i));if(idx>=0){used.add(idx);selected.push(idx);$("letters").children[idx].classList.add("used")}}updateSlots()}
function check(){if(solved.includes(levelIndex)){showMessage("این مرحله کامل شده است.","good");return}if(selected.length!==level().answer.length){showMessage("همهٔ خانه‌ها را با حروف پر کن.","bad");return}const guess=selected.map(i=>level().letters[i]).join("");if(guess===level().answer){solved.push(levelIndex);coins+=5;$("coins").textContent=faDigits(coins);showMessage("درسته، آفرین! 🎉 پنج سکه جایزه گرفتی.","good");$("next").disabled=false;save();$("bar").style.width=((levelIndex+1)/1000*100)+"%";if(levelIndex===999){openModal("تبریک! 🏆","هر ۱۰۰۰ مرحله را به پایان رساندی!");} }else showMessage("این کلمه درست نیست؛ دوباره امتحان کن.","bad")}
function hint(){if(solved.includes(levelIndex)){showMessage("این مرحله قبلاً حل شده است.","good");return}if(coins<10){showMessage("سکه کافی نداری. با حل مرحله‌ها ۵ سکه بگیر.","bad");return}coins-=10;const answer=level().answer;const n=selected.length;const nextChar=answer[n];const idx=level().letters.findIndex((c,i)=>c===nextChar&&!selected.includes(i));if(idx>=0)choose(idx);showMessage("یک حرف از پاسخ آشکار شد. 🪙 ۱۰ سکه کم شد.","good");save();$("coins").textContent=faDigits(coins)}
function next(){if(!solved.includes(levelIndex)){showMessage("اول این مرحله را حل کن.","bad");return}if(levelIndex<999){levelIndex++;render()}else openModal("پایان بازی","همهٔ ۱۰۰۰ مرحله را کامل کرده‌ای!")}
function openModal(title,txt){$("modalTitle").textContent=title;$("modalText").textContent=txt;$("modal").classList.add("show")}
$("check").onclick=check;$("clear").onclick=clearSelection;$("hint").onclick=hint;$("next").onclick=next;
$("reset").onclick=()=>openModal("شروع دوباره؟","پیشرفت و سکه‌ها پاک می‌شوند. اگر مطمئنی، تأیید کن.");
$("modalBtn").onclick=()=>{const title=$("modalTitle").textContent;if(title==="شروع دوباره؟"){levelIndex=0;coins=50;solved=[];save();render()}else if(levelIndex<999&&solved.includes(levelIndex)){next()}$("modal").classList.remove("show")};
function openShop(){
  $("modalTitle").textContent="فروشگاه سکه 🪙";
  $("modalText").textContent="بستهٔ دلخواه را انتخاب کن. این نسخه آفلاین است؛ پرداخت واقعی انجام نمی‌شود و بسته‌ها فقط برای آزمایش فروشگاه هستند.";
  const box=$("shopPacks");box.hidden=false;box.innerHTML="";
  $("modalBtn").hidden=true;$("closeShop").hidden=false;
  const packs=[{coins:100,label:"بسته کوچک",price:"آزمایشی"},{coins:500,label:"بسته متوسط",price:"آزمایشی"},{coins:1200,label:"بسته بزرگ",price:"آزمایشی"}];
  packs.forEach(pack=>{const row=document.createElement("div");row.className="pack";const info=document.createElement("div");info.innerHTML=`<b>${pack.label}</b><br><small>🪙 ${faDigits(pack.coins)} سکه</small>`;const btn=document.createElement("button");btn.textContent="دریافت آزمایشی";btn.onclick=()=>{coins+=pack.coins;save();$("coins").textContent=faDigits(coins);$("modalText").textContent=`${faDigits(pack.coins)} سکهٔ آزمایشی اضافه شد. پرداخت واقعی انجام نشده است.`;box.hidden=true;$("closeShop").hidden=true;$("modalBtn").hidden=false;};row.append(info,btn);box.appendChild(row)});
  $("modal").classList.add("show");
}
$("shop").onclick=openShop;
$("closeShop").onclick=()=>{$("modal").classList.remove("show");$("shopPacks").hidden=true;$("closeShop").hidden=true;$("modalBtn").hidden=false;};
$("modal").addEventListener("click",e=>{if(e.target===$("modal")){ $("modal").classList.remove("show");$("shopPacks").hidden=true;$("closeShop").hidden=true;$("modalBtn").hidden=false; }});
setupLanguages();applyLanguage();
$('startGame').onclick=()=>{$('mainMenu').style.display='none';$('stagesScreen').style.display='none';$('gameWrap').style.display='block';render()};

render();
